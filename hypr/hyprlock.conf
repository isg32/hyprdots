source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/current-wallpaper
    blur_passes = 4
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $on_surface
    font_size = 110
    font_family = Inter Bold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $on_surface
    font_size = 20
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = true
    placeholder_text = <i>Password…</i>
    rounding = 26
    position = 0, -60
    halign = center
    valign = center
}
