general.import = ["~/.config/alacritty/colors.toml"]

[window]
opacity = 0.72
blur = true
decorations = "None"
dynamic_padding = true
dynamic_title = true

[window.padding]
x = 18
y = 14

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }

[scrolling]
history = 10000


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
