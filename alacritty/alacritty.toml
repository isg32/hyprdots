# --- General ---
# This imports the colors generated by your wallpaper script automatically
general.import = [
    "~/.cache/wal/colors-alacritty.toml"
]
general.live_config_reload = true

[window]
# Matches the Waybar transparency
opacity = 0.8
blur = true
dynamic_title = true

[window.padding]
# Slightly more generous padding looks more "boutique"
x = 20
y = 20

[window.class]
instance = "Alacritty"
general = "Alacritty"

# --- Typography ---
[font]
# JetBrains Mono is the gold standard for sophisticated coding fonts
# Make sure to install: 'ttf-jetbrains-mono-nerd'
normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Medium Italic" }
size = 11.0

[font.offset]
x = 0
y = 1 # Added a tiny bit of vertical spacing for readability

# --- Cursor ---
[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Beam" # A thin beam is more minimal than a block
blinking = "On"

# --- Bell ---
[bell]
animation = "EaseOutExpo"
duration = 0

# --- Colors Override ---
# If you want to keep a specific background regardless of the wallpaper,
# uncomment the lines below. Otherwise, wal handles this.
# [colors.primary]
# background = "#0f0f0f"
