# MPD — user instance (systemd --user mpd.service)
music_directory     "~/Music"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"

bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
restore_paused      "yes"
filesystem_charset  "UTF-8"

# Sound out through PipeWire
audio_output {
    type    "pipewire"
    name    "PipeWire"
}

# Feed for the ncmpcpp visualizer (must match visualizer_output_name / data_source)
audio_output {
    type    "fifo"
    name    "Visualizer"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
